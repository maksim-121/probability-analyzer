<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анализатор вероятностей</title>
<meta name="description" content="Вероятности случайных событий методом Монте-Карло: задайте факторы, формулы и условие — получите вероятность с погрешностью.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M7 24V17M13 24V11M19 24V7M25 24V14' stroke='white' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --card: #ffffff;
    --text: #0b0b0b; --text-2: #52514e; --muted: #898781;
    --line: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11, 11, 11, 0.10);
    --s1: #2a78d6; --s2: #eb6834; --band: rgba(42, 120, 214, 0.10); --range: #c3c2b7;
    --accent: #2a78d6; --accent-ink: #ffffff;
    --good: #006300; --good-bg: rgba(12, 163, 12, 0.10); --warn-bg: rgba(250, 178, 25, 0.16);
    --bad: #b3261e; --bad-bg: rgba(208, 59, 59, 0.08);
    --input: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --card: #1a1a19;
      --text: #f0efec; --text-2: #c3c2b7; --muted: #898781;
      --line: #2c2c2a; --axis: #383835; --ring: rgba(255, 255, 255, 0.10);
      --s1: #3987e5; --s2: #d95926; --band: rgba(57, 135, 229, 0.16); --range: #4a4a46;
      --accent: #3987e5; --accent-ink: #ffffff;
      --good: #0ca30c; --good-bg: rgba(12, 163, 12, 0.14); --warn-bg: rgba(250, 178, 25, 0.14);
      --bad: #ff8a80; --bad-bg: rgba(255, 138, 128, 0.10);
      --input: #232322;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --card: #1a1a19;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #898781;
    --line: #2c2c2a; --axis: #383835; --ring: rgba(255, 255, 255, 0.10);
    --s1: #3987e5; --s2: #d95926; --band: rgba(57, 135, 229, 0.16); --range: #4a4a46;
    --accent: #3987e5; --accent-ink: #ffffff;
    --good: #0ca30c; --good-bg: rgba(12, 163, 12, 0.14); --warn-bg: rgba(250, 178, 25, 0.14);
    --bad: #ff8a80; --bad-bg: rgba(255, 138, 128, 0.10);
    --input: #232322;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--page); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  h1, h2, h3 { margin: 0; font-weight: 650; }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* --- шапка */
  .top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between;
         max-width: 1440px; margin: 0 auto; padding: 20px 16px 8px; }
  .top h1 { font-size: 22px; }
  .top p { margin: 2px 0 0; color: var(--text-2); font-size: 14px; }
  .top-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { font-size: 12px; color: var(--text-2); background: var(--warn-bg); padding: 2px 8px; border-radius: 99px; }

  /* --- раскладка */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; max-width: 1440px; margin: 0 auto; padding: 8px 16px 32px; }
  @media (min-width: 1100px) { .layout { grid-template-columns: minmax(420px, 5fr) minmax(0, 7fr); align-items: start; } }
  .pane { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--ring); border-radius: 12px; padding: 16px; min-width: 0; }
  .card h3 { font-size: 16px; margin-bottom: 4px; }
  .sub, .note, .hint { color: var(--text-2); font-size: 13px; margin: 0 0 8px; }
  .note { margin: 8px 0 0; }
  .hint { margin: 6px 0 0; }
  .empty { color: var(--muted); font-size: 13px; margin: 0; }
  .muted { color: var(--muted); font-size: 12px; }
  .btn.small { font-size: 13px; padding: 4px 10px; }
  .csv-row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .csv-row .hint { margin: 0; }
  .csv-pick { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 8px; border-radius: 8px; background: var(--warn-bg); }
  .csv-pick .hint { margin: 0; }
  textarea.dragging { outline: 2px dashed var(--accent); outline-offset: -2px; }
  /* --- этап 4: зависимости */
  .dep { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  .dep select { flex: 1; font-size: 14px; color: var(--text); }
  .dep-note { flex: 1; font-size: 13px; color: var(--text-2); }
  .item.dependent { border-left: 3px solid var(--accent); }
  .cases { display: flex; flex-direction: column; gap: 8px; }
  .case { border: 1px dashed var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .case-head { font-weight: 600; font-size: 14px; flex: none; min-width: 9.5em; }
  .case .row select { flex: 1; }
  .warn-box { background: var(--warn-bg); border-radius: 8px; padding: 8px 10px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  /* --- редактор */
  .step h2 { font-size: 15px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
  .step h2 span { font-weight: 400; color: var(--text-2); font-size: 13px; }
  .step-num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
              background: var(--accent); color: var(--accent-ink); font-size: 12px; }
  .items { display: flex; flex-direction: column; gap: 10px; }
  .item { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
  .row { display: flex; gap: 6px; align-items: center; min-width: 0; }
  input, select, textarea { background: var(--input); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; min-width: 0; }
  input[type="checkbox"], input[type="radio"] { padding: 0; width: auto; flex: none; accent-color: var(--accent); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  textarea { width: 100%; resize: vertical; }
  .name { width: 9.5em; font-weight: 600; flex: none; }
  .row select { flex: 1; }
  .formula { flex: 1; }
  .label { flex: 1; font-size: 13px; color: var(--text-2); }
  .unit { width: 5.5em; flex: none; font-size: 13px; }
  .eq { color: var(--muted); font-weight: 600; }
  .title-input { width: 100%; font-size: 17px; font-weight: 650; border-color: transparent; background: transparent; padding-left: 4px; }
  .desc-input { width: 100%; font-size: 13px; color: var(--text-2); border-color: transparent; background: transparent; padding-left: 4px; }
  .title-input:hover, .desc-input:hover { border-color: var(--line); }
  .fields { display: flex; flex-wrap: wrap; gap: 8px; }
  .field { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--text-2); }
  .field input { width: 7.5em; font-size: 15px; color: var(--text); }
  .ttable { border-collapse: collapse; }
  .ttable th { font-size: 12px; font-weight: 400; color: var(--text-2); text-align: left; padding: 0 6px 2px 0; }
  .ttable td { padding: 2px 6px 2px 0; }
  .ttable input { width: 6.5em; }
  .share { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: right; }
  .shape { display: flex; align-items: flex-end; gap: 10px; font-size: 12px; color: var(--text-2); min-height: 36px; }
  .shape svg { flex: none; }
  .bad { color: var(--bad); }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .45; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; }
  .btn:hover:not(:disabled) { border-color: var(--axis); }
  .icon { border: 0; background: transparent; color: var(--muted); padding: 4px 6px; border-radius: 6px; flex: none; }
  .icon:hover:not(:disabled) { color: var(--text); background: var(--line); }
  .link { border: 0; background: transparent; color: var(--accent); padding: 4px 0; align-self: flex-start; }
  .add { margin-top: 8px; }
  details.help { font-size: 14px; }
  details.help summary { cursor: pointer; font-weight: 600; }
  details.help code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: var(--surface); border: 1px solid var(--line);
                      border-radius: 4px; padding: 0 4px; }
  details.help ul { padding-left: 18px; margin: 8px 0 0; }
  details.help li { margin: 3px 0; }

  /* --- панель запуска */
  .runbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; position: sticky; top: 0; z-index: 2; }
  .runbar .field select, .runbar .field input { font-size: 15px; color: var(--text); }
  .runbar #seed { width: 9em; }
  .seed { display: flex; gap: 4px; }
  .primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 8px 18px; font-weight: 600; margin-left: auto; }
  progress { width: 100%; height: 6px; accent-color: var(--accent); }
  .error { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 0; }
  .stale-banner { background: var(--warn-bg); border-radius: 10px; padding: 8px 12px; font-size: 14px; margin: 0; }
  #results.stale #results-body { opacity: .45; }

  /* --- результаты */
  .hero-label { color: var(--text-2); font-size: 14px; }
  .hero-value { font-size: 56px; font-weight: 650; line-height: 1.1; margin: 4px 0; letter-spacing: -0.01em; }
  .hero-sub { color: var(--text-2); font-size: 14px; }
  .exact { margin-top: 12px; font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
  .exact.good { background: var(--good-bg); border-color: transparent; }
  .exact.good b:first-child { color: var(--good); }
  .exact.warn { background: var(--warn-bg); border-color: transparent; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 8px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .tile-label { font-size: 13px; color: var(--text-2); }
  .tile-value { font-size: 24px; font-weight: 650; }
  .tile-sub { font-size: 12px; color: var(--muted); }
  ul.plain { margin: 6px 0 0; padding-left: 18px; }
  ul.plain li { margin: 4px 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .dotk { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .sw.s1, .dotk.s1 { background: var(--s1); } .sw.s2, .dotk.s2 { background: var(--s2); }
  .chart { width: 100%; min-height: 60px; }
  .chart svg { display: block; overflow: visible; }
  svg .grid { stroke: var(--line); stroke-width: 1; }
  svg .axis { stroke: var(--axis); stroke-width: 1; }
  svg .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  svg .tick.strong { fill: var(--text-2); font-weight: 600; }
  svg .halo { paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
  svg .lbl { fill: var(--text); font-size: 13px; font-weight: 600; }
  svg .s1 { fill: var(--s1); } svg .s2 { fill: var(--s2); }
  svg .dot { stroke: var(--card); stroke-width: 2; }
  svg .line { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  svg .band { fill: var(--band); }
  svg .ref { stroke: var(--text-2); stroke-width: 1; }
  svg .base { stroke: var(--text-2); stroke-width: 1; }
  svg .range { stroke: var(--range); stroke-width: 6; stroke-linecap: round; }
  svg .hit { fill: transparent; }
  svg .hit:hover { fill: var(--ring); }
  .shape svg .axis { stroke: var(--line); }
  .calc { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 8px; font-size: 14px; }
  .calc input { width: 5.5em; margin: 0 4px; }
  .calc output { font-weight: 650; font-variant-numeric: tabular-nums; }
  .table-wrap { overflow-x: auto; }
  .pct-table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
  .pct-table th { font-weight: 400; color: var(--text-2); font-size: 12px; }
  .pct-table th, .pct-table td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--line); }
  .cmp { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; margin-top: 4px; }
  .cmp th { font-weight: 400; color: var(--text-2); font-size: 12px; text-align: right; }
  .cmp th, .cmp td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .cmp td { text-align: right; white-space: nowrap; }
  .cmp td:first-child { text-align: left; white-space: normal; color: var(--text-2); }
  .cmp td:nth-child(2) { font-weight: 650; }
  .verdict { margin: 10px 0 0; font-size: 14px; }

  /* --- режимы и панели */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; max-width: 1440px; margin: 0 auto; padding: 4px 16px; }

  /* --- простой режим: вопросы */
  .s-step h2 { font-size: 17px; display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; }
  .s-step h2 .step-num { flex: none; margin-top: 1px; }
  .choice { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .opt-card { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; background: var(--surface); }
  .opt-card.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .opt-card input { margin-top: 4px; accent-color: var(--accent); }
  .opt-card b { display: block; }
  .opt-card small { color: var(--text-2); font-size: 13px; }
  .row2 { display: flex; flex-wrap: wrap; gap: 8px; }
  .row2 .grow { flex: 1; min-width: 180px; }
  .row2 .grow input { width: 100%; }
  .field select { font-size: 15px; color: var(--text); }
  .s-name { flex: 1; font-weight: 600; font-size: 15px; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 4px 12px; font-size: 13px; color: var(--text-2); }
  .seg button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .opts { display: flex; flex-direction: column; gap: 4px; }
  .opt-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; color: var(--text-2); }
  .opt-row input { width: 5em; color: var(--text); }
  .opt-foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .sum { font-size: 13px; color: var(--good); }
  .sum.bad { color: var(--bad); }
  .sentence { font-size: 14px; line-height: 2.3; }
  .sentence input { width: 4.5em; margin: 0 2px; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
  .check input { margin-top: 3px; accent-color: var(--accent); }
  .alt { border-left: 3px solid var(--accent); padding: 6px 0 6px 10px; display: flex; flex-direction: column; gap: 6px; }
  .alt-head { font-weight: 600; font-size: 14px; }
  .s-err { color: var(--bad); font-size: 13px; }
  .s-err:empty { display: none; }
  .goal { font-size: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .goal input:not([type="checkbox"]) { width: 6em; font-size: 16px; }

  /* --- простой режим: ответ */
  .s-q { color: var(--text-2); font-size: 15px; margin-top: 10px; }
  .s-big { font-size: 64px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; }
  .s-big span { font-size: 24px; font-weight: 600; color: var(--text-2); }
  .s-sub { color: var(--text-2); font-size: 14px; margin: 4px 0 12px; }
  .badge-good, .badge-warn, .badge-bad { display: inline-flex; align-items: center; gap: 6px; font-weight: 650; font-size: 14px; padding: 4px 10px; border-radius: 99px; }
  .badge-good { background: var(--good-bg); color: var(--good); }
  .badge-warn { background: var(--warn-bg); color: var(--text); }
  .badge-bad { background: var(--bad-bg); color: var(--bad); }
  .b-icon { font-weight: 800; }
  .dots { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; max-width: 420px; margin-bottom: 8px; }
  .dots i { aspect-ratio: 1; border-radius: 3px; background: var(--line); }
  .dots i.y { background: var(--s1); }
  .sw.nn { background: var(--line); }
  .ideas { display: flex; flex-direction: column; gap: 12px; }
  .idea { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
  .idea-text { grid-column: 1 / -1; font-size: 14px; }
  .idea-bar { height: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; display: flex; }
  .idea-bar .now { background: var(--s1); opacity: .35; }
  .idea-bar .gain { background: var(--s1); }
  .idea-num { font-weight: 650; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .idea-num small { color: var(--good); font-weight: 600; margin-left: 4px; }
  .s-details summary { cursor: pointer; font-weight: 600; }
  .s-details code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: var(--surface);
                    border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .s-fix h3 { color: var(--bad); }
  /* --- простой режим v2: выбор ситуации, «что вы знаете», варианты */
  .schemes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .scheme { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; text-align: left; border: 1px solid var(--line);
            background: var(--surface); border-radius: 12px; padding: 14px; color: var(--text); }
  .scheme:hover { border-color: var(--accent); }
  .scheme .sc-icon { grid-row: span 3; font-size: 26px; line-height: 1; }
  .scheme b { font-size: 16px; }
  .scheme small { color: var(--text-2); font-size: 13px; }
  .scheme em { color: var(--muted); font-size: 12px; font-style: normal; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 12px; font-size: 14px; }
  .chip:hover { border-color: var(--accent); }
  .s-scheme { display: flex; gap: 8px; align-items: baseline; color: var(--text-2); font-size: 14px; padding: 0 4px; }
  .s-scheme span { font-weight: 600; color: var(--text); }
  .know-q { font-size: 13px; color: var(--text-2); }
  .s-item.closed { gap: 4px; }
  .s-sum { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent;
           padding: 2px 4px; font-size: 14px; color: var(--text-2); }
  .s-sum .edit { color: var(--accent); white-space: nowrap; }
  .done { align-self: flex-start; }
  /* вопрос своими словами */
  .ask { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .ask input { flex: 1; min-width: 220px; font-size: 17px; padding: 10px 12px; }
  .ask .primary { margin-left: 0; }
  .s-said { font-weight: 600; color: var(--text); }
  .s-say { color: var(--text-2); }
  .s-scheme { flex-wrap: wrap; line-height: 1.4; }
  .hint.s-tip { margin-top: 4px; }
  /* компактный блок вопросов */
  .s-form { padding: 4px 16px; }
  .s-form .q { padding: 14px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .s-form .q:first-child { border-top: 0; }
  .q-t { display: flex; gap: 8px; align-items: flex-start; font-weight: 650; font-size: 16px; }
  .q-t .step-num { flex: none; margin-top: 1px; }
  .q-t small { font-weight: 400; color: var(--text-2); font-size: 13px; }
  .q-c { display: flex; flex-direction: column; gap: 6px; }
  .q-c .hint { margin: 0; }
  .inline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 15px; }
  .inline input { width: 5.2em; }
  .inline input.wide { width: auto; flex: 1; min-width: 12em; }
